<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product -- SHOPROCK</title><meta id="md" name="description" content="SHOPROCK gift">
<link rel="stylesheet" href="css/shoprock.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/premium.css"></head><body>
<div id="hdr"></div>
<section style="padding-top:40px"><div class="container" id="out"><div class="loading">Loading</div></div></section>
<section class="rule" id="revsec" style="display:none"><div class="container" style="max-width:820px"><p class="eyebrow">Reviews</p><h2 style="margin:8px 0 8px">What customers say</h2><div id="rvsum" style="margin-bottom:8px"></div><div id="rvlist"></div>
 <details class="rvform"><summary>Bought this? Write a review</summary><p class="muted" style="margin-bottom:14px">Use your order reference and the last 4 digits of your mobile so we know it is a real purchase. Reviews appear after we approve them.</p>
 <div class="row"><div class="field"><label for="rv_o">Order reference</label><input id="rv_o" placeholder="ORD-XXXXXXXX" autocomplete="off"></div><div class="field"><label for="rv_l">Last 4 digits of mobile</label><input id="rv_l" inputmode="numeric" maxlength="4"></div><div class="field"><label for="rv_n">Your name (optional)</label><input id="rv_n" maxlength="40"></div></div>
 <div class="field"><label>Rating</label><div class="starpick" id="rv_s"></div></div>
 <div class="field"><label for="rv_t">Title (optional)</label><input id="rv_t" maxlength="80"></div><div class="field"><label for="rv_b">Your review</label><textarea id="rv_b" rows="4" maxlength="600"></textarea></div>
 <button class="btn" id="rv_go">Submit review</button></details></div></section>
<div id="ftr"></div><script src="js/common.js"></script><script src="js/extras.js"></script>
<script>
(async()=>{const id=new URLSearchParams(location.search).get("id"),o=document.getElementById("out"),$=i=>document.getElementById(i);
 try{const [p,S,cat0]=await Promise.all([api("public.product",{product_id:id}),siteCfg(),loadProducts().catch(()=>[])]);
  const M=metaOf(S,p.product_id),V=variantsOf(S,p.product_id),avail=p.available!==false,cat=cat0;
  document.title=p.name+" -- SHOPROCK";$("md").content=(p.description||"").slice(0,155);
  const imgs=[...new Set([...(p.gallery||[]),p.image_url].filter(Boolean))],vid=videoEmbed(p.video_url);
  const media=[...imgs.map(u=>({t:"i",u})),...(vid?[{t:"v",v:vid}]:[])];
  let VAR=(V.find(v=>v.available!==false)||V[0]||{}).id||"";const inCart=Cart.get().find(i=>i.product_id===p.product_id);if(inCart&&inCart.variant&&V.some(v=>v.id===inCart.variant))VAR=inCart.variant;
  const price=()=>unitPrice(p,{variant:VAR},S);
  const show=i=>{const m=media[i];$("gm").innerHTML=!m?'<div class="empty" style="height:100%;display:grid;place-items:center">No photo yet</div>':m.t==="i"?`<img src="${esc(m.u)}" alt="${esc(p.name)}">`:m.v.k==="i"?`<iframe src="${esc(m.v.s)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy" title="Product video"></iframe>`:`<video src="${esc(m.v.s)}" controls playsinline></video>`;
   document.querySelectorAll("#gt button").forEach((b,j)=>b.classList.toggle("on",j===i));};
  const hl=(p.highlights||[]).length?`<ul class="hl">${p.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`:"";
  const paras=[...(p.long_description||[]),...(M.story?String(M.story).split(/\n+/).filter(Boolean):[])];
  const about=paras.length?`<details open><summary>About this gift</summary>${paras.map(t=>`<p class="muted">${esc(t)}</p>`).join("")}</details>`:"";
  const facts=[["Occasion",M.occasion],["Perfect for",M.recipient],["Gift suitability",M.gift_suitability],["Tags",(M.tags||[]).join(", ")]].filter(x=>x[1]);
  const det=facts.length?`<details><summary>Gift details</summary><dl class="facts">${facts.map(f=>`<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl></details>`:"";
  const dlv=`<details><summary>Delivery &amp; returns</summary><p class="muted">${p.delivery_estimate&&!/^\d{4}-\d{2}-\d{2}/.test(p.delivery_estimate)?`Estimated delivery: ${esc(p.delivery_estimate)}.`:"Delivery estimate is confirmed when you order."} See the <a href="policies.html#shipping">shipping</a> and <a href="policies.html#returns">returns &amp; refunds</a> policies.</p></details>`;
  const chips=V.length?`<fieldset class="vars"><legend>Choose an option</legend>${V.map(v=>`<button type="button" class="vchip ${v.id===VAR?"on":""}" data-v="${esc(v.id)}" aria-pressed="${v.id===VAR}" ${v.available===false?"disabled":""}>${esc(v.label)}${SITE.v3_pricing&&+v.price>0&&+v.price!==+p.price?" &middot; "+inr(v.price):""}${v.available===false?" (sold out)":""}</button>`).join("")}</fieldset>`:"";
  o.innerHTML=`<div class="split" style="align-items:start"><div class="gallery"><div class="gmain" id="gm"></div>${media.length>1?`<div class="gthumbs" id="gt">${media.map((m,i)=>`<button type="button" data-i="${i}" aria-label="Show ${m.t==="i"?"photo":"video"} ${i+1}">${m.t==="i"?`<img src="${esc(m.u)}" alt="">`:"&#9654;"}</button>`).join("")}</div>`:'<div id="gt"></div>'}</div>
  <div class="pinfo">${p.badge?`<span class="pbadge" style="position:static;display:inline-block;margin-bottom:12px">${esc(p.badge)}</span>`:""}<p class="eyebrow">${esc(p.category||"Gift")}</p><div class="ptitle"><h1>${esc(p.name)}</h1><button type="button" class="heart" id="heart" aria-label="Save to wishlist" aria-pressed="false">&#9825;</button></div>
  <div id="rsum" class="rate" style="margin-bottom:8px"></div>
  <p class="pprice" id="pprice">${inr(price())}</p><p class="${avail?"instock":"outstock"}" id="avail">${avail?"In stock":"Currently unavailable"}</p><p class="muted lead2">${esc(p.description)}</p>${hl}${chips}
  <div id="gift"></div><div class="pbuy"><div class="field qtyf"><label for="qty">Quantity</label><input id="qty" type="number" min="1" max="10" value="1" ${avail?"":"disabled"}></div><button class="btn" id="add" ${avail?"":"disabled"}>Add to cart</button> <button class="btn ghost" id="buy" ${avail?"":"disabled"}>Buy now</button></div>
  <div class="chips"><a class="btn wa" id="waq" style="display:none" target="_blank" rel="noopener" href="#">Ask on WhatsApp</a><button class="btn ghost" id="share" type="button">Share</button></div>
  <div class="acc">${about}${det}${dlv}</div></div></div><div id="bundles"></div>
  <div class="sticky-buy"><div><b id="pprice2">${inr(price())}</b><div class="muted" style="font-size:.75rem">${esc(p.name)}</div></div><button class="btn" id="add2" ${avail?"":"disabled"}>Add to cart</button></div>`;
  show(0);galleryExtras();$("gt").onclick=e=>{const b=e.target.closest("button");if(b)show(+b.dataset.i);};
  let NOTE="";giftPanel($("gift"),giftCfg(S),"",v=>NOTE=v);
  const heart=$("heart"),hs=()=>{const on=Wish.has(p.product_id);heart.innerHTML=on?"&#9829;":"&#9825;";heart.setAttribute("aria-pressed",on);heart.classList.toggle("on",on);heart.setAttribute("aria-label",on?"Remove from wishlist":"Save to wishlist");};hs();heart.onclick=()=>{const on=Wish.toggle(p.product_id);hs();toast(on?"Saved to your wishlist":"Removed from wishlist");};
  document.querySelector(".vars")&&(document.querySelector(".vars").onclick=e=>{const b=e.target.closest(".vchip");if(!b||b.disabled)return;VAR=b.dataset.v;document.querySelectorAll(".vchip").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on);});$("pprice").innerHTML=$("pprice2").innerHTML=inr(price());if(cartQty(p.product_id))Cart.setVariant(p.product_id,VAR);if(window.drawBundles)window.drawBundles();});
  let busy=false;const q=()=>Math.max(1,Math.min(10,parseInt($("qty").value)||1)),label=()=>{const n=cartQty(p.product_id);["add","add2"].forEach(i=>{const b=$(i);if(b)b.textContent=n?"Go to cart \u00b7 "+n:"Add to cart";});},
   add=()=>{if(!avail||busy)return;if(cartQty(p.product_id)){location.href="cart.html";return;}busy=true;addOnce(p.product_id,q(),NOTE,VAR);track("add_to_cart",{product_id:p.product_id});miniCart(p.product_id);setTimeout(()=>busy=false,700);};
  label();document.addEventListener("cart:change",label);addEventListener("storage",label);
  $("add").onclick=add;$("add2").onclick=add;$("buy").onclick=()=>{if(!avail)return;buyNow(p.product_id,q(),NOTE,VAR);track("add_to_cart",{product_id:p.product_id,buy_now:1});location.href="checkout.html";};
  $("share").onclick=async()=>{const d={title:p.name,text:`${p.name} - ${inr(price())}`,url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);toast("Link copied");}}catch{}};
  loadConfig().then(()=>{const u=waUrl(`Hi! I'm interested in "${p.name}" (${inr(price())}). Is it available?`);if(u){const a=$("waq");a.href=u;a.style.display="";}});
  track("product_view",{product_id:p.product_id});
  const ld={"@context":"https://schema.org","@type":"Product",name:p.name,image:imgs,description:p.description,offers:{"@type":"Offer",priceCurrency:"INR",price:price(),availability:avail?"https://schema.org/InStock":"https://schema.org/OutOfStock"}};
  // bundles (only genuine, fully-available combinations; savings shown only when the backend can honour the bundle price)
  const drawBundles=window.drawBundles=()=>{try{const bl=bundlesFor(p.product_id,cat,S,{[p.product_id]:VAR});$("bundles").innerHTML=!bl.length?"":`<section class="recs"><h3>Complete the set</h3>${bl.map(b=>`<div class="bundle card">${b.kind==="week"?`<span class="pbadge" style="position:static;display:inline-block;margin-bottom:8px">Surprise Week</span><p class="muted" style="margin-bottom:6px">Three gifts in one order. Open one a day, and plan a message for each day after you check out. Items may arrive separately; see our shipping policy.</p>`:""}<b>${esc(b.name)}</b><div class="rgrid">${b.items.map(x=>`<div class="rc"><a href="product.html?id=${encodeURIComponent(x.product_id)}"><img loading="lazy" src="${esc(x.image_url)}" alt="${esc(x.name)}"></a><div class="rb"><a href="product.html?id=${encodeURIComponent(x.product_id)}">${esc(x.name)}</a><div class="muted">${inr(x.price)}</div></div></div>`).join("")}</div><p>${b.priced?`<s class="muted">${inr(b.reg)}</s> <b>${inr(b.price)}</b> <span class="save">You save ${inr(b.save)}</span>`:`<b>${inr(b.reg)}</b> <span class="muted">for all ${b.items.length}</span>`}</p><button type="button" class="btn sm" data-bundle="${esc(b.id)}">${b.kind==="week"?"Add the week to cart":"Add all to cart"}</button></div>`).join("")}</section>`;
   $("bundles").onclick=e=>{const b=e.target.closest("[data-bundle]");if(!b)return;const bd=bl.find(x=>x.id===b.dataset.bundle);bd.items.forEach(x=>{if(!cartQty(x.product_id))Cart.add(x.product_id,1,"",x.product_id===p.product_id?VAR:null,bd.priced?bd.id:"");else if(bd.priced)Cart.setBundle(x.product_id,bd.id);});if(bd.kind==="week"){try{sessionStorage.setItem("sr_week",JSON.stringify({n:bd.name,i:bd.items.map(x=>x.product_id)}));}catch{}}track("bundle_add",{bundle_id:bd.id});toast(bd.kind==="week"?"Added. Plan your 3 messages after checkout.":"Added to your cart");};}catch{}};drawBundles();
  try{const rl=recsFor(p,cat,S,Cart.get().map(i=>i.product_id));o.insertAdjacentHTML("beforeend",recSection(rl,"You may also love"));o.addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(b){if(cartQty(b.dataset.add))toast("Already in your cart");else{Cart.add(b.dataset.add,1);toast("Added to cart");}track("rec_click",{product_id:b.dataset.add,from:"product",add:1});return;}const a=e.target.closest(".recs a[href^='product.html']");if(a)track("rec_click",{product_id:new URL(a.href).searchParams.get("id"),from:"product"});});}catch{}
  // reviews: section appears only when real approved reviews exist
  let pick=0;const sp=$("rv_s");const drawStars=()=>{sp.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="${n<=pick?"on":""}" data-n="${n}" aria-label="${n} star">&#9733;</button>`).join("");};drawStars();
  sp.onclick=e=>{const b=e.target.closest("button");if(b){pick=+b.dataset.n;drawStars();}};
  try{const rv=await api("public.reviews",{product_id:p.product_id});
   if(rv.count){$("revsec").style.display="";$("rsum").innerHTML=`${stars(rv.avg)} <span class="muted">${rv.avg} (${rv.count} review${rv.count>1?"s":""})</span>`;$("rvsum").innerHTML=`${stars(rv.avg)} <span class="muted">${rv.avg} out of 5 from ${rv.count} review${rv.count>1?"s":""}</span>`;
    ld.aggregateRating={"@type":"AggregateRating",ratingValue:rv.avg,reviewCount:rv.count};
    $("rvlist").innerHTML=rv.reviews.map(r=>`<div class="rv">${stars(r.rating)} <b style="margin-left:8px">${esc(r.title||"")}</b><div class="meta">${esc(r.name)}${r.verified?" &middot; Verified buyer":""} &middot; ${esc(r.date)}</div><p>${esc(r.body)}</p></div>`).join("");}
   else{$("rsum").remove();$("revsec").style.display="none";o.insertAdjacentHTML("beforeend",'<details class="rvform-lite"></details>');o.querySelector(".rvform-lite").replaceWith($("revsec"));$("revsec").style.display="";$("rvlist").innerHTML="";document.querySelector("#revsec .eyebrow").textContent="Bought this?";document.querySelector("#revsec h2").textContent="Share how it went";}
  }catch{}
  const sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);
  $("rv_go").onclick=async()=>{if(!pick){toast("Please choose a star rating.",1);return;}$("rv_go").disabled=true;
   try{await api("public.reviewCreate",{product_id:p.product_id,order_id:$("rv_o").value,phone_last4:$("rv_l").value,name:$("rv_n").value,rating:pick,title:$("rv_t").value,body:$("rv_b").value});
    toast("Thank you! Your review will appear once approved.");["rv_o","rv_l","rv_n","rv_t","rv_b"].forEach(i=>$(i).value="");pick=0;drawStars();}
   catch(e){toast(e.message,1);}$("rv_go").disabled=false;};
 }catch(e){o.innerHTML='<div class="empty">This product is not available. <a href="shop.html">Back to the collection</a></div>';}})();
</script></body></html>
