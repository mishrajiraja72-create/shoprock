<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — SHOPROCK</title><link rel="stylesheet" href="css/shoprock.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/premium.css"><link rel="stylesheet" href="css/v4.css"></head><body>
<div id="hdr"></div>
<section><div class="container" style="max-width:720px"><h2 style="margin-bottom:16px">Checkout</h2>
<div id="mode" class="notice" style="margin-bottom:24px">Checking checkout status…</div>
<form id="f" novalidate>
 <div class="row"><div class="field"><label for="customer_name">Full name</label><input id="customer_name" autocomplete="name"></div>
 <div class="field"><label for="phone">Mobile (10 digits)</label><input id="phone" inputmode="numeric" autocomplete="tel"></div></div>
 <div class="field"><label for="email">Email (optional, lets you see this order in My account)</label><input id="email" type="email" autocomplete="email"></div>
 <div class="field"><label for="address">Delivery address</label><textarea id="address" rows="3" autocomplete="street-address"></textarea></div>
 <div class="row"><div class="field"><label for="city">City</label><input id="city"></div><div class="field"><label for="state">State</label><input id="state"></div><div class="field"><label for="pin">PIN code</label><input id="pin" inputmode="numeric" maxlength="6"></div></div>
 <div class="field"><label for="gift_message">Gift message (optional)</label><textarea id="gift_message" rows="2" maxlength="300" oninput="this.dataset.t=1"></textarea></div>
 <div id="addons"></div><div id="summary" class="card" style="margin-bottom:16px"></div>
 <div class="field" style="max-width:380px"><label for="coupon">Coupon code (optional)</label><div style="display:flex;gap:8px"><input id="coupon" autocomplete="off"><button type="button" class="btn ghost sm" id="capply">Apply</button></div><div id="cmsg" class="muted" style="margin-top:6px"></div></div>
 <div id="gifting"></div>
 <label style="text-transform:none;letter-spacing:0;display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="policy" style="width:auto;margin-top:4px"> I have read the <a href="policies.html#shipping">shipping</a>, <a href="policies.html#returns">returns</a> and <a href="policies.html#terms">terms</a>.</label><br>
 <button class="btn" id="go">Place order</button>
</form><div id="done"></div></div></section>
<div id="ftr"></div><script src="js/common.js"></script><script src="js/extras.js"></script>
<script>
const $=id=>document.getElementById(id);let idem=sessionStorage.getItem("sr_idem")||crypto.randomUUID();try{sessionStorage.setItem("sr_idem",idem)}catch{}
let CAT=[],SC={},SC0={};const getSel=()=>{try{return JSON.parse(sessionStorage.getItem("sr_addons")||"[]")}catch{return[]}},setSel=a=>{try{sessionStorage.setItem("sr_addons",JSON.stringify(a))}catch{}};
let GIFT={pkg:false,sec:false,rec:false},GDONE=false;
const GC=()=>(SC&&SC.gifting)||{},optList=()=>{const g=GC(),o=[];if(GIFT.pkg&&g.packaging&&g.packaging.on)o.push({k:"pkg",name:g.packaging.name||"Premium packaging",price:Math.max(0,Math.round(+g.packaging.price||0))});if(GIFT.sec&&g.secret&&g.secret.on)o.push({k:"sec",name:g.secret.label||"Secret gift",price:Math.max(0,Math.round(+g.secret.price||0))});return o},optTotal=()=>optList().reduce((a,x)=>a+x.price,0),
 optLines=()=>optList().map(o=>`<div class="sl"><span>${esc(o.name)}</span><span>${o.price?"+"+inr(o.price):"Free"}</span></div>`).join(""),
 giftArg=()=>{const o={};if(GIFT.pkg&&optList().some(x=>x.k==="pkg"))o.packaging=true;if(GIFT.sec&&optList().some(x=>x.k==="sec"))o.secret=true;if(GIFT.rec){o.recipient_name=($("g_rn")||{}).value||"";o.recipient_phone=($("g_rp")||{}).value||"";}return Object.keys(o).length?{gift:o}:{}};
function drawGifting(){if(GDONE||!$("gifting"))return;GDONE=true;const g=GC(),pk=g.packaging&&g.packaging.on?g.packaging:null,se=g.secret&&g.secret.on?g.secret:null,pr=x=>x?"+"+inr(Math.round(+x)):"Free";
 $("gifting").innerHTML=`<fieldset class="special"><legend>Make it extra special 🎁</legend><p class="muted" style="margin-bottom:8px">All optional. Nothing here is selected for you.</p>
 ${pk?`<label class="opt"><input type="checkbox" id="g_pkg"> <span><b>${esc(pk.name||"Premium packaging")}</b> &middot; ${pr(pk.price)}<br><span class="muted">${esc(pk.desc||"")}</span></span></label>`:""}
 ${se?`<label class="opt"><input type="checkbox" id="g_sec"> <span><b>${esc(se.label||"Send it as a secret")}</b> &middot; ${pr(se.price)}<br><span class="muted">${esc(se.note||"")}</span></span></label>`:""}
 <label class="opt"><input type="checkbox" id="g_rec"> <span><b>Deliver to someone else</b><br><span class="muted">Use the address fields below for their delivery address.</span></span></label>
 <div id="g_recf" hidden><div class="field"><label for="g_rn">Name of the person receiving it</label><input id="g_rn" maxlength="60"></div><div class="field"><label for="g_rp">Their mobile (optional, for the courier)</label><input id="g_rp" inputmode="numeric" maxlength="14"></div></div></fieldset>`;
 const on=(id,k)=>{const e=$(id);if(e)e.onchange=()=>{GIFT[k]=e.checked;drawSummary();};};on("g_pkg","pkg");on("g_sec","sec");$("g_rec").onchange=e=>{GIFT.rec=e.target.checked;$("g_recf").hidden=!GIFT.rec;};}
function drawSummary(){const c=Cart.get(),sel=getSel();
 if(!c.length){$("f").innerHTML='<div class="empty">Your cart is empty. <a href="shop.html">Browse gifts</a></div>';return;}
 const rows=c.map(i=>({i,p:CAT.find(x=>x.product_id===i.product_id)})).filter(r=>r.p),U=r=>unitPrice(r.p,r.i,SC),sub=rows.reduce((a,r)=>a+U(r)*r.i.qty,0),bs=bundleSaving(rows.map(r=>r.i),rows.map(r=>r.p),SC),net=sub-bs;
 const fs=+(SC0.free_shipping_above||0),flat=(SC0.shipping_flat===undefined||SC0.shipping_flat==="")?null:Number(SC0.shipping_flat),shipTxt=fs&&net>=fs?"Shipping: free on this order. The final payable amount is confirmed when you place the order.":(flat!==null&&isFinite(flat)?`Shipping: ${flat?inr(flat):"free"}. The final payable amount is confirmed when you place the order.`:"Shipping and the final payable amount are confirmed by the server when you place the order.");
 $("summary").innerHTML=rows.map(r=>`<div class="sl"><span>${esc(r.p.name)}${variantLabel(r.p,r.i,SC)?" ("+esc(variantLabel(r.p,r.i,SC))+")":""} <span class="cqty"><button type="button" data-cq="-1" data-id="${esc(r.i.product_id)}" aria-label="Decrease quantity of ${esc(r.p.name)}">&minus;</button> <b>${r.i.qty}</b> <button type="button" data-cq="1" data-id="${esc(r.i.product_id)}" aria-label="Increase quantity of ${esc(r.p.name)}">+</button></span></span><span>${inr(U(r)*r.i.qty)} ${sel.includes(r.i.product_id)?`<button type="button" class="btn ghost sm" data-rm="${esc(r.i.product_id)}">Remove</button>`:""}</span></div>`).join("")+`<hr style="border-color:var(--line);margin:10px 0">${bs?`<div class="sl"><span>Bundle saving</span><span>&minus;${inr(bs)}</span></div>`:""}${optLines()}<b>${optTotal()?"Subtotal":"Items"}: ${inr(net+optTotal())}</b><div class="muted">${shipTxt}</div>`;
 const ad=addonsFor(c,CAT,SC,sel),chosen=sel.map(id=>CAT.find(x=>x.product_id===id)).filter(x=>x&&c.some(i=>i.product_id===x.product_id)),show=[...chosen,...ad.filter(x=>!chosen.includes(x))].slice(0,Math.max(2,chosen.length));
 $("addons").innerHTML=show.length?`<div class="card addon"><h3>Make Your Gift Extra Special</h3><p class="muted" style="margin:4px 0 12px">Optional extras. Nothing is added unless you choose it.</p>${show.map(p=>{const on=sel.includes(p.product_id);return `<div class="rc"><img loading="lazy" src="${esc(p.image_url)}" alt=""><div class="rb"><b>${esc(p.name)}</b><div class="muted">${inr(p.price)}${p.description?" &middot; "+esc(String(p.description).slice(0,70)):""}</div></div><button type="button" class="btn ${on?"ghost":""} sm" data-${on?"rm":"add"}="${esc(p.product_id)}">${on?"Added &#10003; Remove":"Add"}</button></div>`}).join("")}</div>`:"";
 drawGifting();const gm=$("gift_message");if(!gm.dataset.t){const n=rows.filter(r=>r.i.note);gm.value=(n.length===1?n[0].i.note:n.map(r=>r.p.name+": "+r.i.note).join(" | ")).slice(0,300);}}
try{const A=JSON.parse(localStorage.getItem("sr_acct")||"null");if(A&&A.email&&$("email")&&!$("email").value)$("email").value=A.email;}catch{}
document.addEventListener("click",e=>{const cq=e.target.closest("[data-cq]");if(cq&&CAT.length){Cart.setQty(cq.dataset.id,cartQty(cq.dataset.id)+ +cq.dataset.cq);if(!Cart.get().length){location.reload();return;}drawSummary();return;}const ra=e.target.closest(".recs a[href^='product'],#done a[href^='product']");if(ra)track("rec_click",{product_id:new URL(ra.href,location.href).searchParams.get("id"),from:"checkout"});const b=e.target.closest("[data-add],[data-rm]");if(!b||!CAT.length)return;const sel=getSel();
 if(b.dataset.add){if(cartQty(b.dataset.add)){toast("Already in your order");return;}Cart.add(b.dataset.add,1);setSel([...sel,b.dataset.add]);track("addon_add",{product_id:b.dataset.add});toast("Added to your order");}else{Cart.remove(b.dataset.rm);setSel(sel.filter(x=>x!==b.dataset.rm));toast("Removed");}drawSummary();});
(async()=>{if(!Cart.get().length){drawSummary();$("mode").remove();return;}
 try{[CAT,SC]=await Promise.all([loadProducts(),siteCfg()]);drawSummary();}catch(e){$("summary").innerHTML='<div class="errorbox">Could not load order summary.</div>';}
 const cfg=await loadConfig();SC0=cfg;drawSummary();track("checkout_start",{items:Cart.count()});const md=cfg.checkout_mode;const wu=waUrl("Hi! I need help with my order.");if(wu)$("mode").insertAdjacentHTML("afterend",`<p class="muted" style="margin:-12px 0 16px"><a target="_blank" rel="noopener" href="${esc(wu)}">Need help? Chat on WhatsApp</a></p>`);$("mode").innerHTML=md==="MANUAL"?"<b>Pay by UPI.</b> Place your order, then complete the UPI payment shown on the next screen. We confirm your order after verifying the payment.":md==="LIVE"?"<b>Secure checkout.</b> You will complete payment right after placing the order.":"<b>DEMO checkout.</b> No payment is collected and no real order is created until the store owner connects a payment gateway.";
})();

async function afterOrder(r){let h="";try{const l=afterRecs(CAT,SC,window.ORD||[],3);h=`<div class="card" style="margin-top:16px"><p style="margin-bottom:12px"><a class="btn" href="track.html">Track your order</a> </p>${await waHelp("Hi! I need help with my order "+r.order_id+".")}</div>`+blank(recSection(l,"Your Next Special Moment \u{1F48C}"))+(l.length?'<p style="margin-top:12px"><a class="btn ghost" href="shop.html">Browse all gifts</a></p>':"");}catch{}$("done").insertAdjacentHTML("beforeend",h);$("done").onclick=e=>{const b=e.target.closest("[data-add]");if(b){Cart.add(b.dataset.add,1);toast("Added to your cart");}};}
function showDone(r){setTimeout(()=>{afterOrder(r);momentPrompt($("done"));},0);
 const wrap=(inner)=>`<div class="card"><p class="eyebrow">Order reference</p><h3>${esc(r.order_id)}</h3>${(()=>{try{const w=JSON.parse(sessionStorage.getItem("sr_week")||"null");return w&&w.i&&w.i.every(x=>(window.ORD||[]).includes(x))?`<p class="notice">Your Surprise Week is ready to plan. <a href="reveal.html?week=1">Write your 3 messages 💌</a></p>`:""}catch{return""}})()}${(window.ORDITEMS||[]).length?`<ul class="hl">${window.ORDITEMS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${inner}<p class="muted" style="margin-top:12px">Want to make it unforgettable? <a href="reveal.html">Send a surprise reveal 💌</a><br>Track with your order reference and the last 4 digits of your mobile. <a href="track.html">Track order</a></p></div>`;
 if(r.mode==="MANUAL"&&r.upi_id){
  const amt=Number(r.total).toFixed(2),note=encodeURIComponent("Order "+r.order_id),
   link=`upi://pay?pa=${encodeURIComponent(r.upi_id)}&pn=${encodeURIComponent(r.upi_payee_name||"SHOPROCK")}&am=${amt}&cu=INR&tn=${note}`,
   wa=waUrl(`Hi! I placed order ${r.order_id} (${inr(r.total)}) and have paid. UTR / reference: `,r.whatsapp_number);
  $("done").innerHTML=wrap(`<p style="margin:12px 0">${esc(r.note)}</p><div class="paybox"><div><p class="muted">Amount to pay</p><h3 style="margin-bottom:12px">${inr(r.total)}</h3><div class="upi" id="upiid">${esc(r.upi_id)}</div>
   <p style="margin:14px 0"><a class="btn" href="${esc(link)}">Pay with UPI app</a> <button class="btn ghost" type="button" id="cp">Copy UPI ID</button></p></div><div><div class="qr" id="qr"></div><p class="muted" style="margin-top:8px;font-size:.8rem">Scan with any UPI app</p></div></div>
   <p class="muted" style="margin:16px 0">${esc(r.payment_instructions||"")}</p>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="${esc(wa)}">I have paid - share on WhatsApp</a>`:""}
   <p class="muted" style="margin-top:12px">Payment status: <span class="badge warn">Awaiting payment</span></p>`);
  $("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(r.upi_id);toast("UPI ID copied");};
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>{try{new QRCode($("qr"),{text:link,width:168,height:168});}catch{}};document.head.appendChild(s);
 }else{
  $("done").innerHTML=wrap(`<p style="margin:12px 0">${esc(r.note)}</p><p class="muted">Payment status: <span class="badge warn">Unpaid</span></p>`);
 }
}
if($("capply"))$("capply").onclick=async()=>{const code=$("coupon").value.trim();if(!code){$("cmsg").textContent="";return;}try{const r=await api("public.coupon",{code,items:Cart.get()});$("cmsg").innerHTML=`<span style="color:var(--ok)">Coupon ${esc(r.code)} applied: you save ${inr(r.discount)}.</span>`;}catch(e){$("cmsg").innerHTML=`<span style="color:var(--danger)">${esc(e.message)}</span>`;}};
$("f").onsubmit=async e=>{e.preventDefault();document.querySelectorAll(".field.err").forEach(x=>{x.classList.remove("err");x.querySelector(".errmsg")?.remove()});
 const v=id=>$(id).value.trim(),bad=[];const set=(id,m)=>{bad.push(id);const f=$(id).closest(".field");f.classList.add("err");f.insertAdjacentHTML("beforeend",`<div class="errmsg">${m}</div>`)};
 if(v("customer_name").length<2)set("customer_name","Enter your name");
 if(!/^[6-9]\d{9}$/.test(v("phone").replace(/\D/g,"").slice(-10)))set("phone","Enter a valid 10-digit mobile number");
 if(v("email")&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email")))set("email","Enter a valid email");
 if(GIFT.rec&&$("g_rn")&&$("g_rn").value.trim().length<2)set("g_rn","Enter the name of the person receiving it");
 if(v("address").length<10)set("address","Enter the complete address");if(!v("city"))set("city","Required");if(!v("state"))set("state","Required");if(!/^\d{6}$/.test(v("pin")))set("pin","6-digit PIN");
 if(!$("policy").checked){toast("Please accept the policies to continue.",1);return;} if(bad.length)return;
 $("go").disabled=true;
 try{const r=await api("public.createOrder",{idempotency_key:idem,customer_name:v("customer_name"),phone:v("phone"),email:v("email"),address:v("address"),city:v("city"),state:v("state"),pin:v("pin"),gift_message:v("gift_message"),accepted_policies:true,coupon_code:v("coupon"),items:Cart.get(),...giftArg()});
  try{sessionStorage.setItem("sr_note",($("gift_message")||{}).value||"")}catch{}window.ORD=Cart.get().map(i=>i.product_id);window.ORDITEMS=Cart.get().map(i=>{const p=CAT.find(x=>x.product_id===i.product_id);return p?`${p.name}${variantLabel(p,i,SC)?" ("+variantLabel(p,i,SC)+")":""} \u00d7 ${i.qty}`:null}).filter(Boolean);optList().forEach(o=>window.ORDITEMS.push(o.name+(o.price?" (+"+inr(o.price)+")":"")));if(GIFT.rec&&$("g_rn")&&$("g_rn").value.trim())window.ORDITEMS.push("Deliver to: "+$("g_rn").value.trim());try{const h=JSON.parse(localStorage.getItem("sr_orders")||"[]");h.unshift({id:r.order_id,t:Date.now(),p:window.ORD});localStorage.setItem("sr_orders",JSON.stringify(h.slice(0,20)))}catch{}track("order_complete",{order_id:r.order_id,total:r.total,addon:getSel().length?1:0});Cart.clear();try{sessionStorage.removeItem("sr_idem");sessionStorage.removeItem("sr_addons")}catch{}
  $("f").style.display="none";showDone(r);
 }catch(err){toast(err.message,1);$("go").disabled=false;}};
</script></body></html>
