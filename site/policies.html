<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Policies -- SHOPROCK</title><link rel="stylesheet" href="css/shoprock.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/premium.css"></head><body>
<div id="hdr"></div>
<section><div class="container" style="max-width:780px" id="pol"><div class="loading">Loading</div></div></section>
<div id="ftr"></div><script src="js/common.js"></script>
<script>
const fmt=t=>String(t||"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith("## ")?`<h3 style="margin:18px 0 6px">${esc(x.slice(3))}</h3>`:`<p class="muted" style="margin-top:10px">${esc(x).replace(/\n/g,"<br>")}</p>`).join("");
(async()=>{const o=document.getElementById("pol");
 try{const [c]=await Promise.all([api("public.content"),loadConfig()]);
  const sec=(id,t,b,first)=>`<h2 id="${id}" style="${first?"":"margin-top:48px"}">${t}</h2>${b}`;
  const contact=[SITE.whatsapp_number?`<a href="${waUrl("Hi! I have a question.")}" target="_blank" rel="noopener">Chat with us on WhatsApp</a>`:"",SITE.support_email?`Email: <a href="mailto:${esc(SITE.support_email)}">${esc(SITE.support_email)}</a>`:"",SITE.support_contact&&!/OWNER REVIEW/.test(SITE.support_contact)?esc(SITE.support_contact):""].filter(Boolean).join("<br>");
  const faq=(SITE.faq||[]).map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")+`<details><summary>How do I track an order?</summary><p>Use the <a href="track.html">tracking page</a> with your order reference.</p></details>`;
  o.innerHTML=sec("shipping","Shipping &amp; delivery",fmt(c.policy_shipping),1)+sec("returns","Returns, cancellations &amp; refunds",fmt(c.policy_returns))+sec("privacy","Privacy policy",fmt(c.policy_privacy))+sec("terms","Terms &amp; conditions",fmt(c.policy_terms))+sec("contact","Contact &amp; support",`<p class="muted" style="margin-top:10px">${contact||"Use the contact details in the footer."}</p>`)+sec("faq","FAQ",faq);
  if(location.hash){const e=document.querySelector(location.hash);if(e)e.scrollIntoView();}
 }catch(e){o.innerHTML='<div class="errorbox">Could not load this page. Please try again shortly.</div>';}})();
</script></body></html>
