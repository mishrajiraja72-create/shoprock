<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track order — SHOPROCK</title><link rel="stylesheet" href="css/shoprock.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/premium.css"></head><body>
<div id="hdr"></div>
<section><div class="container" style="max-width:560px"><h2 style="margin-bottom:24px">Track your order</h2>
<form id="f"><div class="field"><label for="oid">Order reference</label><input id="oid" required></div><div class="field"><label for="l4">Last 4 digits of mobile</label><input id="l4" maxlength="4" required></div><button class="btn">Track</button></form><div id="out" style="margin-top:24px"></div></div></section>
<div id="ftr"></div><script src="js/common.js"></script><script src="js/extras.js"></script>
<script>
/* After delivery: optional review per item (existing, moderated reviewCreate) + optional thank-you code (NOT tied to any review or rating). */
function afterDelivery(r){if(!r.delivered||r.is_demo)return;const o=document.getElementById("out"),oid=r.order_id,l4=document.getElementById("l4").value.trim(),items=(r.items||[]).filter(i=>i.product_id&&!String(i.product_id).startsWith("OPT-"));
 o.insertAdjacentHTML("beforeend",`<div class="card" id="tdone" style="margin-top:16px"><p class="eyebrow">It arrived 💗</p><h3 style="margin:6px 0">How did they react?</h3><p class="muted">Optional. Reviews are checked before they appear, and you never need to write one to get anything from us.</p>${items.map(i=>`<div class="rvbox" data-p="${esc(i.product_id)}"><b>${esc(i.name)}</b><div class="stars" role="group" aria-label="Rating for ${esc(i.name)}">${[1,2,3,4,5].map(s=>`<button type="button" class="star" data-s="${s}" aria-label="${s} star" aria-pressed="false">&#9733;</button>`).join("")}</div><textarea rows="3" maxlength="600" placeholder="Tell us how it went (at least 10 characters)" aria-label="Your review of ${esc(i.name)}"></textarea><button type="button" class="btn sm" data-send>Send review</button></div>`).join("")}${r.thanks?'<div id="thx" style="margin-top:16px"><h4>A thank-you from us</h4><p class="muted">For your next gift. No review needed.</p><button class="btn ghost" id="thxbtn" type="button">Get my thank-you code</button></div>':""}</div>`);
 document.getElementById("tdone").onclick=async e=>{const st=e.target.closest(".star");
  if(st){const box=st.closest(".rvbox");box.dataset.r=st.dataset.s;box.querySelectorAll(".star").forEach((b,i)=>{const on=i<+st.dataset.s;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});return;}
  const send=e.target.closest("[data-send]");
  if(send){const box=send.closest(".rvbox"),rating=+box.dataset.r||0,body=box.querySelector("textarea").value.trim();if(!rating){toast("Please choose a star rating.",1);return;}if(body.length<10){toast("Please write at least 10 characters.",1);return;}send.disabled=true;
   try{await api("public.reviewCreate",{product_id:box.dataset.p,order_id:oid,phone_last4:l4,rating,body});box.innerHTML="<p>Thank you! Your review will appear once approved.</p>";}catch(err){toast(err.message,1);send.disabled=false;}return;}
  if(e.target.id==="thxbtn"){e.target.disabled=true;try{const c=await api("public.thanksCoupon",{order_id:oid,phone_last4:l4});
   document.getElementById("thx").innerHTML=`<h4>Your thank-you code</h4><p style="font-size:1.4rem;letter-spacing:.1em" id="thxcode">${esc(c.code)}</p><p class="muted">${c.used?"This code has already been used.":`${esc(String(c.percent))}% off your next order${c.expires?", valid until "+esc(fmtDate(c.expires)||c.expires):""}. One use. Enter it at checkout.`}</p><button class="btn ghost" id="thxcp" type="button">Copy code</button> <a class="btn" href="shop.html">Choose their next gift</a>`;}
   catch(err){toast(err.message,1);e.target.disabled=false;}return;}
  if(e.target.id==="thxcp"){try{await navigator.clipboard.writeText(document.getElementById("thxcode").textContent);toast("Code copied");}catch{toast("Select the code and copy it");}}};}
</script>
<script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const o=document.getElementById("out");o.innerHTML='<div class="loading">Looking up</div>';
 try{const r=await api("public.trackOrder",{order_id:document.getElementById("oid").value.trim(),phone_last4:document.getElementById("l4").value.trim()});
  o.innerHTML=`<div class="card"><p class="eyebrow">${esc(r.order_id)}</p>${r.is_demo?'<p class="notice">Demo order — no payment was taken.</p>':''}<p>Payment: <span class="badge ${r.payment_status==="PAID"?"ok":"warn"}">${esc(r.payment_status)}</span> Status: <span class="badge">${esc(r.order_status)}</span></p>
  ${r.items.map(i=>`<div>${esc(i.name)} × ${i.qty}</div>`).join("")}<p style="margin-top:8px">Total: ${inr(r.total)}</p>${r.tracking_number?`<p>Tracking: ${esc(r.tracking_number)}</p>`:'<p class="muted">Tracking will appear once shipped.</p>'}${r.delivery_estimate?`<p>Estimated delivery: ${esc(r.delivery_estimate)}</p>`:""}${(r.updates||[]).length?`<h4 style="margin-top:12px">Updates</h4><ul class="hl">${r.updates.map(u=>`<li>${esc(fmtDate(u.at)||u.at||"")} ${esc(u.status||u.text||"")}</li>`).join("")}</ul>`:""}<p class="muted">While you wait: <a href="reveal.html">send them a surprise reveal 💌</a> or <a href="gift-finder.html">find another gift</a>.</p><p class="muted" id="tsup">Need help? Use WhatsApp below${SITE.support_email?`, or email <a href="mailto:${esc(SITE.support_email)}">${esc(SITE.support_email)}</a>`:""}. See also <a href="policies.html#contact">contact &amp; support</a>.</p><p id="tw" style="margin-top:12px"></p></div><div id="tr"></div>`;
  afterDelivery(r);
  loadConfig().then(()=>waHelp(`Hi! I need help with my order ${r.order_id}.`)).then(h=>{document.getElementById("tw").innerHTML=h;});
  try{const [cat,S]=await Promise.all([loadProducts(),siteCfg()]);const ids=r.items.map(i=>i.product_id).filter(Boolean),l=afterRecs(cat,S,ids,3);document.getElementById("tr").innerHTML=blank(recSection(l,"While Your Gift Is On Its Way \u{1F497}"));document.getElementById("tr").onclick=e=>{const b=e.target.closest("[data-add]");if(b){if(!cartQty(b.dataset.add))Cart.add(b.dataset.add,1);track("rec_click",{product_id:b.dataset.add,from:"tracking",add:1});toast("Added to your cart. Your tracking stays right here.");}};}catch{}
 }catch(err){o.innerHTML=`<div class="errorbox">${esc(err.message)}</div>`;}};</script></body></html>
